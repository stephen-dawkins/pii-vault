# Builds PII Vault for Windows (PII-Vault-Setup.exe) on a Windows machine at GitHub.
#  - Every push to the "windows" branch: builds a test installer you can download from the run's
#    Artifacts section (nothing is published).
#  - When a release is published (the same release that holds the Mac app): builds the installer and
#    attaches PII-Vault-Setup.exe + its .sha256 to that release, which is what the in-app updater uses.
#    The release tag must match engine/piivault/__init__.py (tag v0.5.0 = version 0.5.0).
#  - Run by hand (Actions > Build Windows > Run workflow), optionally attaching to an existing tag.
name: Build Windows

on:
  push:
    branches: [windows]
    paths: ["engine/**", "windows/**", ".github/workflows/windows.yml"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      attach_to_tag:
        description: "Attach the installer to this existing release tag (for example v0.4.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools and libraries
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r windows/requirements-windows.txt

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = python windows/build/make_version_info.py
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "PII Vault $v"

      - name: Check the release tag matches the version
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          if ("${{ github.event.release.tag_name }}" -ne "v${{ steps.ver.outputs.version }}") {
            throw "Release tag ${{ github.event.release.tag_name }} doesn't match engine version ${{ steps.ver.outputs.version }}."
          }

      - name: Engine self-test
        shell: pwsh
        env:
          PYTHONPATH: engine
        run: |
          python -c "from piivault import winplat; print('OCR:', winplat.windows_ocr_available()); print('Downloads:', winplat.downloads_dir())"
          python -m piivault doctor

      - name: Build the app (PyInstaller)
        shell: pwsh
        run: pyinstaller --noconfirm --distpath dist --workpath build-tmp windows/build/piivault.spec

      - name: Smoke-test the packaged engine
        shell: pwsh
        run: |
          & "dist/PII Vault/piivault-engine.exe" doctor
          if ($LASTEXITCODE -ne 0) { throw "Packaged engine failed" }

      - name: Get the WebView2 installer
        shell: pwsh
        run: Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile windows/build/MicrosoftEdgeWebview2Setup.exe

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" windows/build/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          $h = (Get-FileHash dist/PII-Vault-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  PII-Vault-Setup.exe" | Out-File -Encoding ascii -NoNewline dist/PII-Vault-Setup.exe.sha256
          Get-Item dist/PII-Vault-Setup.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: PII-Vault-Setup-${{ steps.ver.outputs.version }}
          path: |
            dist/PII-Vault-Setup.exe
            dist/PII-Vault-Setup.exe.sha256

      - name: Attach to the release
        if: github.event_name == 'release' || inputs.attach_to_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.event_name }}" -eq "release") { "${{ github.event.release.tag_name }}" } else { "${{ inputs.attach_to_tag }}" }
          gh release upload $tag dist/PII-Vault-Setup.exe dist/PII-Vault-Setup.exe.sha256 --clobber
